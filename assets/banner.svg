<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0"/>
    </linearGradient>

    <!-- Terminal Window Gradient -->
    <linearGradient id="termGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35"/>
    </pattern>

    <!-- Filters -->
    <filter id="blurGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <style>
      .blink {
        animation: blinkAnim 1s infinite steps(1, start);
      }
      @keyframes blinkAnim {
        0%, 50% { opacity: 1; }
        51%, 100% { opacity: 0; }
      }
      .float-orb1 {
        animation: orbFloat1 12s ease-in-out infinite alternate;
      }
      .float-orb2 {
        animation: orbFloat2 15s ease-in-out infinite alternate;
      }
      @keyframes orbFloat1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 40px) scale(1.15); }
      }
      @keyframes orbFloat2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-70px, -30px) scale(1.1); }
      }
      .stream-beam {
        stroke-dasharray: 80 160;
        animation: beamMove 5s linear infinite;
      }
      @keyframes beamMove {
        from { stroke-dashoffset: 480; }
        to { stroke-dashoffset: 0; }
      }
      .tag-pill {
        transition: transform 0.3s ease;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)"/>

  <!-- Dynamic Glowing Orbs (in background) -->
  <g class="float-orb1">
    <circle cx="200" cy="100" r="180" fill="url(#glowGrad1)" filter="url(#blurGlow)"/>
  </g>
  <g class="float-orb2">
    <circle cx="1020" cy="300" r="220" fill="url(#glowGrad2)" filter="url(#blurGlow)"/>
  </g>

  <!-- Cyber Grid -->
  <rect width="1200" height="420" fill="url(#grid)"/>

  <!-- Animated Data Flow Line (Background layer) -->
  <path d="M 0 350 Q 300 280, 600 360 T 1200 320" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.6" class="stream-beam"/>
  <path d="M 0 380 Q 400 340, 800 390 T 1200 360" fill="none" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.4" class="stream-beam" style="animation-duration: 7s;"/>

  <!-- Subtle Terminal Mockup Window (Positioned on the Right Background/Midground) -->
  <g transform="translate(730, 65)" filter="url(#subtleShadow)">
    <rect width="420" height="280" rx="14" fill="url(#termGrad)" stroke="#475569" stroke-width="1.2" stroke-opacity="0.5"/>
    <!-- Terminal Header -->
    <rect width="420" height="34" rx="14" fill="#1e293b" fill-opacity="0.95"/>
    <rect y="20" width="420" height="14" fill="#1e293b" fill-opacity="0.95"/>
    <line x1="0" y1="34" x2="420" y2="34" stroke="#334155" stroke-width="1"/>
    <!-- Window Control Buttons -->
    <circle cx="20" cy="17" r="5.5" fill="#ef4444"/>
    <circle cx="38" cy="17" r="5.5" fill="#f59e0b"/>
    <circle cx="56" cy="17" r="5.5" fill="#10b981"/>
    <text x="210" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="11" text-anchor="middle" font-weight="500">cloud-shell ~ zsh</text>

    <!-- Terminal Code/CLI Content -->
    <g transform="translate(22, 58)" font-family="'Fira Code', 'JetBrains Mono', Consolas, Monaco, monospace" font-size="12">
      <!-- Line 1 -->
      <text fill="#38bdf8" font-weight="600">user@cloud</text>
      <text x="75" fill="#64748b">:</text>
      <text x="83" fill="#a855f7">~/terminal</text>
      <text x="156" fill="#f8fafc">$</text>
      <text x="170" fill="#34d399">cloudshell connect --region us-east</text>

      <!-- Line 2 Output -->
      <text y="28" fill="#64748b">[INFO] Initializing secure container...</text>
      <text y="48" fill="#64748b">[INFO] WebSocket connected (23ms)</text>

      <!-- Line 3 Status -->
      <text y="74" fill="#fbbf24">⚡ Status:</text>
      <text x="65" y="74" fill="#e2e8f0">Persistent storage mounted ($HOME)</text>

      <!-- Line 4 Dynamic Prompt -->
      <text y="104" fill="#38bdf8" font-weight="600">user@cloud</text>
      <text x="75" y="104" fill="#64748b">:</text>
      <text x="83" y="104" fill="#a855f7">~/terminal</text>
      <text x="156" y="104" fill="#f8fafc">$</text>
      <text x="170" y="104" fill="#e2e8f0">start-session --gpu</text>
      <rect x="306" y="93" width="7.5" height="14" fill="#38bdf8" class="blink"/>

      <!-- Mini stats pills inside terminal -->
      <g transform="translate(0, 130)">
        <rect width="180" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="12" y="16" fill="#38bdf8" font-size="10">Session: Active (10 Gbps)</text>
        <rect x="190" width="180" height="24" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
        <text x="202" y="16" fill="#34d399" font-size="10">Zero-Trust: Enforced 🔒</text>
      </g>
    </g>
  </g>

  <!-- Foreground Main Branding & Header Content (Always in foreground, never obscured) -->
  <g transform="translate(80, 115)">
    <!-- Pill Category Badge -->
    <g class="tag-pill">
      <rect width="270" height="30" rx="15" fill="#1e293b" fill-opacity="0.9" stroke="#38bdf8" stroke-width="1.2"/>
      <circle cx="16" cy="15" r="4.5" fill="#38bdf8"/>
      <text x="28" y="19" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.5">CLOUD CLI &amp; TERMINALS ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text y="70" fill="url(#primaryTextGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome Cloud CLI
    </text>
    <text y="118" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
      &amp; Terminal Workspaces
    </text>

    <!-- Subtitle / Tagline -->
    <text y="156" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="400">
      Curated browser-based shells, modern GPU terminal emulators &amp; cloud development environments.
    </text>

    <!-- Feature Highlights / Pills -->
    <g transform="translate(0, 185)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="600">
      <!-- Pill 1 -->
      <g>
        <rect width="130" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
        <text x="14" y="18" fill="#38bdf8">☁️ Cloud Shells</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(140, 0)">
        <rect width="138" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
        <text x="14" y="18" fill="#a855f7">⚡ GPU Emulators</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(288, 0)">
        <rect width="146" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
        <text x="14" y="18" fill="#34d399">🤖 AI-Native CLIs</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(444, 0)">
        <rect width="140" height="28" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#475569" stroke-width="1"/>
        <text x="14" y="18" fill="#f59e0b">🛡️ Zero-Trust SSH</text>
      </g>
    </g>
  </g>
</svg>